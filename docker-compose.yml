version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: kpi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpi_user
      POSTGRES_PASSWORD: kpi_pass
      POSTGRES_DB: kpi_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi_user -d kpi_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
