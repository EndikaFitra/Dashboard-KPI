version: "3.9"

services:
  postgres_v2:
    image: postgres:15-alpine
    container_name: kpi_postgres_v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpi_user
      POSTGRES_PASSWORD: kpi_pass
      POSTGRES_DB: kpi_dw_v2
    ports:
      - "5433:5432"        # Port 5433 agar tidak bentrok dengan DB lama (5432)
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi_user -d kpi_dw_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_v2:
